<div class="flex justify-center items-center min-h-form">
  <mat-card class="w-full max-w-md p-6">
    <mat-card-header>
      <mat-card-title class="text-2xl font-bold mb-4">系統登入</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        class="flex flex-col gap-4"
      >
        <mat-form-field appearance="outline">
          <mat-label>電子郵件 (Email)</mat-label>
          <input matInput formControlName="email" type="email" />
          @if (loginForm.get("email")?.hasError("required")) {
            <mat-error>Email 為必填</mat-error>
          }
          @if (loginForm.get("email")?.hasError("email")) {
            <mat-error>Email 格式錯誤</mat-error>
          }
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>密碼 (Password)</mat-label>
          <input matInput formControlName="password" type="password" />
          @if (loginForm.get("password")?.hasError("minlength")) {
            <mat-error>密碼長度需至少 6 位</mat-error>
          }
        </mat-form-field>
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loginForm.invalid"
        >
          登入
        </button>
        <div class="text-center mt-4">
          還沒有帳號？
          <a routerLink="/register" class="text-link">立即註冊</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

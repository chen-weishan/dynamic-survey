# 測試專用設定。啟用方式：測試類別加 @ActiveProfiles("test")
#
# 為什麼要有這一份：正式的 application.properties 把 DB 帳密與 JWT 密鑰
# 交給環境變數（未設定就啟動失敗，這是刻意的）。測試若沿用那份設定，
# 就會變成「沒設環境變數的人跑不了測試」，等於測試形同虛設。

# H2 記憶體資料庫，MySQL 相容模式。每次測試結束即消滅，不影響本機 MySQL。
spring.datasource.url=jdbc:h2:mem:dynamic_survey_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# 測試專用假密鑰（Base64 明文為 "dynamic-survey-test-only-secret-not-for-production-use-0123456789"）。
# HS512 需要 >= 512 bits，此值為 65 bytes 足夠。刻意選可讀字串，讓人一眼看出是假值。
jwt.secret=ZHluYW1pYy1zdXJ2ZXktdGVzdC1vbmx5LXNlY3JldC1ub3QtZm9yLXByb2R1Y3Rpb24tdXNlLTAxMjM0NTY3ODk=
jwt.expiration=3600000
